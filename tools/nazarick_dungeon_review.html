<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Назарик · проверка подземелья</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#e5dcc5;font:13px system-ui}header{padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #2f354b}h1{font:23px Georgia;margin:0 10px 0 0}button,select,a{font:inherit;border:1px solid #4a475e;background:#192238;color:#e6d7b7;padding:8px 11px;border-radius:7px;text-decoration:none;cursor:pointer}label{display:flex;align-items:center;gap:6px;color:#a9b3c8;font-size:11px}.primary{background:#c7ae78;color:#141827;font-weight:700}iframe{display:block;width:100%;height:calc(100dvh - 168px);min-height:570px;border:0;margin:0 auto}small{color:#7e8ba4}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){header{padding:9px;gap:7px}iframe{height:78dvh}h1{font-size:20px}}</style>
<header><h1>Назарик / десять этажей</h1><a href="/nzd-gallery" target="_blank">Спрайты и фоны ↗</a><a href="/nazarick-dungeon-review" id="music-link">♫ Музыка</a><small>Локальная временная база · реальные игроки не затрагиваются</small></header>
<header><label>Контрольная точка<select id="room"></select></label><label>Отряд<select id="party"><option value="1">Соло</option><option value="3">Трое · союзники автоматически</option></select></label><button class="primary" data-mode="menu">Меню и сохранение</button><button data-mode="fight">Начать бой</button><button data-mode="fight" data-room="0">I · Гробницы</button><button data-mode="fight" data-room="1">II · Катакомбы</button><small>Этажи I–II: обычные противники, без стража. IX: отдых и сокровищница.</small><label>Экран<select id="screen"><option value="100%">Компьютер</option><option value="390px">Телефон 390px</option></select></label></header>
<header><label>Страж<select id="guardian"></select></label><label>Фаза<select id="phase"><option>1</option><option>2</option></select></label><label>Защита<select id="defense"><option value="dodge">Уклонение</option><option value="block">Блок</option></select></label><label>Приём<select id="move"><option value="0">1</option><option value="1">2</option><option value="2">3</option></select></label><button data-mode="pattern">Проверить атаку</button><button data-mode="defeat">Поражение и благословение</button><button data-mode="rewards">Выбор наград</button></header>
<iframe title="Назарик · демо" src="/preview?tgWebAppStartParam=nazarick_1"></iframe>
<script>
let catalog;const $=id=>document.getElementById(id);
fetch('/nzd-catalog').then(r=>r.json()).then(d=>{catalog=d;$('room').innerHTML=d.rooms.map(r=>'<option value="'+r.index+'">'+r.floor+' · '+r.name+'</option>').join('');$('guardian').innerHTML=d.guardians.map(g=>'<option value="'+g.id+'">'+g.name+'</option>').join('')+'<option value="shalltear">Шалтир</option><option value="demiurge">Демиург</option><option value="albedo">Альбедо</option><option value="ainz">Аинз</option><option value="pandora">Пандора · сокровищница</option>';updateMoves();});
function updateMoves(){const names=catalog?.guardians.find(g=>g.id===$('guardian').value)?.moves?.[Number($('phase').value)-1]||['Приём 1','Приём 2','Приём 3'];$('move').innerHTML=names.map((name,i)=>'<option value="'+i+'">'+(i+1)+' · '+name+'</option>').join('');}
$('guardian').onchange=updateMoves;$('phase').onchange=updateMoves;
document.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b||!catalog)return;let mode=b.dataset.mode,room=b.dataset.room??$('room').value,who=$('guardian').value;if(mode==='pattern'){if(who==='pandora'){room=8;mode='treasury';}else room=catalog.rooms.find(r=>r.enemies.includes(who)).index;}if(mode==='rewards')room=catalog.rooms.length-1;$('room').value=room;document.querySelector('iframe').src='/nzd-demo?'+new URLSearchParams({mode,room,who,party:$('party').value,phase:$('phase').value,move:$('move').value,defense:$('defense').value});});
$('screen').addEventListener('change',e=>document.querySelector('iframe').style.width=e.target.value);
$('music-link').onclick=e=>{e.preventDefault();window.open('/nzd-music','_blank');};
</script></html>
