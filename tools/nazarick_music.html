<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Назарик · музыка</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c101c;color:#eddfbf;font:15px system-ui}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:32px}p{color:#aab8cb;line-height:1.6}section{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}article{border:1px solid #554663;background:#171e2c;border-radius:16px;padding:12px}img{width:100%;height:190px;object-fit:contain}button{cursor:pointer;min-height:44px;padding:10px;border:1px solid #79658c;border-radius:9px;background:#2d2440;color:#eddfbf;font:inherit;width:100%;margin-top:8px}button[aria-pressed=true]{background:#66507e}#stop{width:auto;padding:12px 24px}@media(max-width:700px){section{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:14px}img{height:160px}}</style>
<main><h1>Музыка Назарика</h1><p>Оригинальная процедурная музыка: вальс Шалтир, клавесин Демиурга, тяжёлый хор Альбедо. У Пандоры — расстроенная, запинающаяся имитация темы Аинза. Нажми фазу; громкость настраивается через ♫.</p><button data-audio-open>♫ Настройки звука</button><section id="themes"></section><p id="status" role="status">Музыка начнётся после нажатия.</p><button id="stop">■ Остановить</button></main>
<script src="/static/audio.js"></script><script>const names={shalltear:'Шалтир',demiurge:'Демиург',albedo:'Альбедо',pandora:'Пандора',ainz:'Аинз'};document.getElementById('themes').innerHTML=Object.entries(names).map(([id,name])=>'<article><img src="/static/assets/nazarick/'+(id==='shalltear'||id==='demiurge'||id==='albedo'?id+'1':id)+'.png" alt="'+name+'"><h3>'+name+'</h3>'+[1,2].map(p=>'<button data-theme="nz_'+id+p+'" aria-pressed="false">Фаза '+p+'</button>').join('')+'</article>').join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(b){ArenaAudio.scene(b.dataset.theme);document.getElementById('status').textContent='Выбрано: '+b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}if(e.target.id==='stop'){ArenaAudio.scene('');document.getElementById('status').textContent='Остановлено';}});</script></html>
